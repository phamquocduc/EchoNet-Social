
openapi: 3.0.0
info:
  title: EchoNet Auth API
  description: API documentation for authentication, role management, and user management
  version: 1.0.0

paths:
  /identity/auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
      responses:
        '200':
          description: Successful login

  /identity/auth/refresh-token:
    post:
      tags:
        - Auth
      summary: User Refresh Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestDto'
      responses:
        '200':
          description: Successful

  /identity/auth/register:
    post:
      tags:
        - Auth
      summary: Create new user (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateDto'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /identity/auth/verify-email:
    post:
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyMailRequestDto'
      responses:
        '201':
          description: Email verified successfully

  /identity/auth/forgot-password/{email}:
    post:
      tags:
        - Auth
      summary: Send forgot password link to user's email
      description: Gửi link đặt lại mật khẩu về email người dùng.
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
          example: user@example.com
      responses:
        '201':
          description: Forgot password link sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordVerify'

  /identity/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password with token
      description: Đặt lại mật khẩu mới bằng token từ email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '200':
          description: Password reset successfully
        '400':
          description: New password and confirm password do not match

  /identity/auth/change-password:
    post:
      tags:
        - Auth
      summary: change password.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDto'
      responses:
        '200':
          description: Change password successfully

  /identity/role:
    get:
      tags:
        - Role
      summary: Get all roles (Admin only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'

  /identity/role/create:
    post:
      tags:
        - Role
      summary: Create a new role (Admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateDto'
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'

  /profile/personal:
    get:
      tags:
        - Profile
      summary: Get profile of current user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

  /profile/personal/update-profile:
    put:
      tags:
        - Profile
      summary: Update profile of current user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateDto'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

  /profile/personal/update/avatar:
    put:
      tags:
        - Profile
      summary: Update user avatar
      description: Uploads and updates the avatar image for the current user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Avatar image file (JPG/PNG/WEBP)
      responses:
        '200':
          description: Avatar updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: No file provided or invalid file type
        '500':
          description: Internal server error

  /profile/personal/update/cover-photo:
    put:
      tags:
        - Profile
      summary: Update user cover photo
      description: Uploads and updates the cover photo for the current user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Cover photo file (JPG/PNG/WEBP)
      responses:
        '200':
          description: Cover photo updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: No file provided or invalid file type
        '500':
          description: Internal server error

  /profile/friendship/request/{userId}:
    post:
      tags:
        - profile/friendship
      summary: Send friend request
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: ID of the user to send request to
      responses:
        '200':
          description: Friend request sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Friend request sent

  /profile/friendship/accept/{userId}:
    post:
      tags:
        - profile/friendship
      summary: Accept friend request
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: ID of the user who sent the friend request
      responses:
        '200':
          description: Friend request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Friend request accepted

  /profile/friendship/reject/{userId}:
    delete:
      tags:
        - profile/friendship
      summary: Reject friend request
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: ID of the user who sent the friend request
      responses:
        '200':
          description: Friend request rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Friend request rejected

  /profile/friendship/cancel/{userId}:
    delete:
      tags:
        - profile/friendship
      summary: Cancel friend request
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Friend request cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Friend request cancelled

  /profile/friendship/unfriend/{userId}:
    delete:
      tags:
        - profile/friendship
      summary: Unfriend user
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: ID of the friend to remove
      responses:
        '200':
          description: Unfriended successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unfriended successfully

  /profile/friendship/follow/{userId}:
    post:
      tags:
        - profile/friendship
      summary: Follow public page
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: ID of the user/page to follow
      responses:
        '200':
          description: Page followed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Page followed

  /profile/friendship/unfollow/{userId}:
    delete:
      tags:
        - profile/friendship
      summary: Unfollow public page
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: ID of the user/page to unfollow
      responses:
        '200':
          description: Page unfollowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Page unfollowed

  /feed/post:
    get:
      tags:
        - Post
      summary: Get all posts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
    post:
      tags:
        - Post
      summary: Create a new post with media
      description: Upload a post with content and multiple media files (images or videos).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content:
                  type: string
                  example: 'Today was a great day!'
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Array of media files (JPG, PNG, WEBP, MP4, etc.)
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Invalid file or missing content
        '500':
          description: Internal server error
  
  /feed/comment:
    post:
      tags:
        - Comment
      summary: Create a new comment with image attachment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content:
                  type: string
                  example: "Great post!"
                postId:
                  type: integer
                  example: 42
                parentCommentId:
                  type: integer 
                  example: 10
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Comment created successfully

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequestDto:
      type: object
      properties:
        email:
          type: string
          example: 'admin123@gmail.com'
        password:
          type: string
          example: 'admin123'

    RoleCreateDto:
      type: object
      properties:
        name:
          type: string

    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    UserCreateDto:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        confirmPassword:
          type: string
        fullname:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        fullname:
          type: string

    Profile:
      type: object
      properties:
        gender:
          type: string
          enum: [male, female, other]
        dob:
          type: string
        avatar:
          type: string
        fullname:
          type: string
        coverphoto:
          type: string
          example: 'https://example.com/coverphoto.jpg'
        phone:
          type: string
          example: '0123456789'
        currentResidence:
          type: string
          example: 'Hanoi, Vietnam'
        hometown:
          type: string
          example: 'Hanoi, Vietnam'
        school:
          type: string
          example: 'Hanoi University'
        workPlace:
          type: string
          example: 'Hanoi, Vietnam'
        relationship:
          type: string
        id:
          type: string
        userid:
          type: number

    ProfileUpdateDto:
      type: object
      properties:
        avatar:
          type: string
          example: 'https://example.com/avatar.jpg'
        fullname:
          type: string
          example: 'Nguyen Van A'
        dob:
          type: string
          format: date
          example: '1990-01-01'
        gender:
          type: string
          enum: [male, female, other]
        coverphoto:
          type: string
          example: 'https://example.com/coverphoto.jpg'
        phone:
          type: string
          example: '0123456789'
        currentResidence:
          type: string
          example: 'Hanoi, Vietnam'
        hometown:
          type: string
          example: 'Hanoi, Vietnam'
        school:
          type: string
          example: 'Hanoi University'
        workPlace:
          type: string
          example: 'Hanoi, Vietnam'
        relationship:
          type: string

    RefreshTokenRequestDto:
      type: object
      properties:
        token:
          type: string
          example: 'your-refresh'
    
    VerifyMailRequestDto:
      type: object
      properties:
        email:
          type: string
          example: 'abc@gmail.com'
        code:
          type: string
          example: '123456'

    ForgotPasswordVerify:
      type: object
      properties:
        email:
          type: string
        token:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        used:
          type: boolean

    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
        confirmNewPassword:
          type: string

    ChangePasswordDto:
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
        confirmNewPassword:
          type: string

    Media:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
          example: https://res.cloudinary.com/demo/image/upload/v123456/media.jpg
        type:
          type: string
          enum: [IMAGE, VIDEO]

    Post:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
          example: "123456"
        content:
          type: string
          example: "Today was a great day!"
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        comments:
          type: array
          items:
            type: object
            description: Comment preview or ID
        reactions:
          type: array
          items:
            type: object
            description: Reaction preview or ID
        createdAt:
          type: string
          format: date-time
          example: "2025-06-14T12:34:56Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-06-14T14:30:00Z"

    CommentCreateDto:
      type: object
      properties:
        postId:
          type: integer
          example: 123
        content:
          type: string
          example: 'This is a comment'
        parentCommentId:
          type: integer
          example: 456
    
